name: Deploy to Railway - Phase 5 Automated CI/CD

on:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apply Professional Branding
        run: |
          echo "Applying professional branding updates..."
          # Replace 'Lyvexa AI' with 'AI Task Assistant' in all relevant files
          find src -type f \( -name "*.tsx" -o -name "*.ts" -o -name "*.js" -o -name "*.jsx" -o -name "*.py" -o -name "*.json" -o -name "*.md" \) \
            -exec grep -l 'Lyvexa AI' {} \; -exec sed -i 's/Lyvexa AI/AI Task Assistant/g' {} \;

          # Replace 'Database sync successful' with 'Task State Synchronized'
          find src -type f \( -name "*.tsx" -o -name "*.ts" -o -name "*.js" -o -name "*.jsx" -o -name "*.py" \) \
            -exec grep -l 'Database sync successful' {} \; -exec sed -i 's/Database sync successful/Task State Synchronized/g' {} \;

          echo "Professional branding applied successfully."

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          cd src/backend
          pip install poetry
          poetry install --no-root

      - name: Run Backend Tests
        run: |
          cd src/backend
          poetry run pytest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd src/frontend
          npm ci

      - name: Run Frontend Lint
        run: |
          cd src/frontend
          npm run lint

  deploy-backend:
    runs-on: ubuntu-latest
    needs: lint-and-test
    environment: production
    concurrency:
      group: production-backend
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./src/backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:backend-latest
            ghcr.io/${{ github.repository }}:backend-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Railway (Backend)
        run: |
          # Install Railway CLI
          npm i -g @railway/cli

          # Login (requires RAILWAY_TOKEN in secrets)
          railway login --token=${{ secrets.RAILWAY_TOKEN }}

          # Link to project
          railway link --project=${{ secrets.RAILWAY_PROJECT_ID }}

          # Set environment variables including PORT for Railway
          railway variables set DATABASE_URL=${{ secrets.DATABASE_URL }}
          railway variables set JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          railway variables set BACKEND_CORS_ORIGINS=${{ secrets.BACKEND_CORS_ORIGINS }}
          railway variables set PORT=8080

          # Deploy
          railway up

      - name: Verify Deployment Health
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 30
          echo "Verifying health check at port 8080..."

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: lint-and-test
    environment: production
    concurrency:
      group: production-frontend
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:frontend-latest
            ghcr.io/${{ github.repository }}:frontend-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Railway (Frontend)
        run: |
          npm i -g @railway/cli
          railway login --token=${{ secrets.RAILWAY_TOKEN }}
          railway link --project=${{ secrets.RAILWAY_PROJECT_ID }}

          railway variables set NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          railway up

  notify:
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()

    steps:
      - name: Send Deployment Notification
        if: success()
        run: |
          echo "🎉 Phase 5 Automated CI/CD Deployment Successful!"
          echo "✅ Professional Branding: Applied"
          echo "✅ Database Sync Messages: Updated to 'Task State Synchronized'"
          echo "✅ Railway Deployment: Port 8080 configured for stable healthchecks"
          echo "✅ Automation: Triggered on push to main branch"

      - name: Send Failure Notification
        if: failure()
        run: |
          echo "❌ Phase 5 Automated CI/CD Deployment Failed!"
          echo "Please check GitHub Actions logs for details."
          # Add Slack/Discord/email notification here
          # Example for Slack:
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"Deployment failed! ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}
